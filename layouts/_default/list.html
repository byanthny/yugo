{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{- with .Pages }}
<ul>
  {{- range . }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="meta">
      {{- if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time> · {{ end -}}
      {{ .ReadingTime }} min
    </span>
  </li>
  {{- end }}
</ul>
{{- end }}
{{ end }}
